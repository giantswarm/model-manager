# app-test-suite (ATS >= 1.0) config, consumed by the generated
# `run-tests-with-ats` CircleCI job (execute-chart-tests). The job creates a
# kind cluster; ATS applies the CRDs listed below, installs the packaged chart
# with `helm upgrade --install --wait` (tests/test-values.yaml, the namespace
# below) and runs `pytest -m smoke` in tests/ats.
#
# The smoke (tests/ats/test_smoke.py) is the chart-level install check: the
# chart installs on a bare cluster and its Deployment becomes ready with the
# image the branch build pushed (branchPublish in giantswarm/github makes
# execute-chart-tests wait on that push; the chart resolves the image tag from
# the stamped appVersion). No serving backend is reachable from the ATS
# cluster, and none is needed: /readyz answers unconditionally, backend health
# is reported by /backendz and GET /api/v1/backend instead. Behaviour against
# real backends (Ollama, KServe, Lemonade) is verified in agentlab.
app-tests-app-config-file: tests/test-values.yaml
app-tests-deploy-namespace: agent-platform

# Manifests applied before the install. ATS passes the value to one
# `kubectl apply --server-side -f`, so a comma-separated list works: ATS's
# bundled CRDs (/etc/ats/crds), the `kagent` namespace the test values point
# the chart at (tests/ats/cluster-prerequisites), plus the kagent ModelConfig CRD model-manager
# discovers at startup and wires models into. Without it the service logs a
# discovery warning and falls back to its default API version; with it the
# smoke covers the discovery path. Bump the pin together with the platform's
# kagent.
cluster-crds: /etc/ats/crds,tests/ats/cluster-prerequisites,https://raw.githubusercontent.com/giantswarm/kagent/v0.1.42/helm/kagent/crds/kagent.dev/kagent.dev_modelconfigs.yaml

# functional: no second scenario. upgrade: an upgrade from the last release in
# the catalog is a follow-up (agent-platform-standalone has the recipe).
skip-steps: [functional, upgrade]
