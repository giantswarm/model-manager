suite: networkpolicy
templates:
  - templates/networkpolicy.yaml
tests:
  - it: limits default API ingress to same-namespace gateways
    asserts:
      - isKind:
          of: NetworkPolicy
      - lengthEqual:
          path: spec.ingress[0].from
          count: 2
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8080
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: muster
      - notExists:
          path: spec.ingress[0].from[0].namespaceSelector
      - equal:
          path: spec.ingress[0].from[1].podSelector.matchLabels["app.kubernetes.io/name"]
          value: agentgateway
      - notExists:
          path: spec.ingress[0].from[1].namespaceSelector

  - it: requires both the collector namespace and pod identity for metrics
    asserts:
      - lengthEqual:
          path: spec.ingress[1].from
          count: 1
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kube-system
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: alloy
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["app.kubernetes.io/instance"]
          value: alloy-metrics
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 9464

  - it: preserves explicit namespace permissions during overlap
    set:
      networkPolicy.ingressNamespaces:
        - legacy-gateway
      networkPolicy.metricsNamespaces:
        - legacy-metrics
    asserts:
      - equal:
          path: spec.ingress[0].from[2].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: legacy-gateway
      - equal:
          path: spec.ingress[1].from[1].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: legacy-metrics

  - it: supports an explicit local opt-out
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: excludes metrics ingress when the listener is disabled
    set:
      observability.metrics.enabled: false
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1
