suite: JWKS hosts that may resolve privately
templates:
  - templates/deployment.yaml
set:
  oauth.enabled: true
  oauth.baseURL: https://manager.example.test
  oauth.dex.issuerURL: https://dex.example.test
  oauth.dex.clientID: manager
  oauth.existingSecret: manager-oauth
tests:
  - it: lists the JWKS hosts other than the issuer's that may resolve privately
    set:
      oauth:
        sso:
          allowPrivateIPJWKSHosts:
            - keys.internal.example
            - jwks.internal.example
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAUTH_ALLOW_PRIVATE_IP_JWKS_HOSTS
            value: keys.internal.example,jwks.internal.example

  - it: renders no JWKS host list by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: OAUTH_ALLOW_PRIVATE_IP_JWKS_HOSTS
