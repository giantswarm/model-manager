suite: OAuth settings from the deprecated keys
templates:
  - templates/deployment.yaml
set:
  oauth.enabled: true
  oauth.baseURL: https://manager.example.test
  oauth.dex.issuerURL: https://dex.example.test
  oauth.dex.clientID: manager
  oauth.existingSecret: manager-oauth
  oauth.trustedAudiences:
    - agent-platform
tests:
  - it: renders the Dex settings as OAUTH_* variables and no OAuth arguments besides the switches
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH_ISSUER, value: https://manager.example.test}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH_PROVIDER, value: dex}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH_STORAGE_BACKEND, value: memory}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH_ENABLE_CLIENT_ID_METADATA_DOCUMENTS, value: "true"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH_DEX_ISSUER_URL, value: https://dex.example.test}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH_DEX_CLIENT_ID, value: manager}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH_DEX_CLIENT_SECRET_FILE, value: /etc/model-manager/oauth-client/client-secret}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: oauth-client
            secret:
              secretName: manager-oauth
              defaultMode: 0440
              items: [{key: dex-client-secret, path: client-secret}]
      - contains:
          path: spec.template.spec.containers[0].args
          content: --enable-oauth=true
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content: {name: OAUTH_DEX_CA_FILE}
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content: {name: OAUTH_TRUSTED_AUDIENCES}
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content: {name: OAUTH_ALLOW_PUBLIC_CLIENT_REGISTRATION}
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--(oauth-|dex-|sso-|google-|allow-private-oauth-urls|allow-public-client-registration)

  - it: trusts Dex as the OpenID Provider for the trusted audiences
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="OAUTH_TRUSTED_ISSUERS")].value
          value: '[{"acceptedTypHeaders":["","JWT"],"allowPrivateIPJWKSHosts":["dex.example.test"],"audiences":["agent-platform"],"issuer":"https://dex.example.test","jwksURI":"https://dex.example.test/keys","openIDProvider":true}]'

  - it: adds the deprecated JWKS hosts and the CA to the Dex entry
    set:
      oauth.dex.caSecret.name: dex-ca
      oauth.sso.allowPrivateIPJWKSHosts: [keys.internal.example]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH_DEX_CA_FILE, value: /etc/model-manager/idp-ca/ca.crt}
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="OAUTH_TRUSTED_ISSUERS")].value
          value: '[{"acceptedTypHeaders":["","JWT"],"allowPrivateIPJWKSHosts":["dex.example.test","keys.internal.example"],"audiences":["agent-platform"],"caFile":"/etc/model-manager/idp-ca/ca.crt","issuer":"https://dex.example.test","jwksURI":"https://dex.example.test/keys","openIDProvider":true}]'
      - contains:
          path: spec.template.spec.volumes
          content:
            name: idp-ca
            secret:
              secretName: dex-ca
              items: [{key: ca.crt, path: ca.crt}]

  - it: renders the Google settings with the callback as redirect URL
    set:
      oauth.provider: google
      oauth.baseURL: https://manager.example.test/
      oauth.google.clientID: google-client
      oauth.trustedAudiences: [google-client]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH_PROVIDER, value: google}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH_GOOGLE_CLIENT_ID, value: google-client}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH_GOOGLE_CLIENT_SECRET_FILE, value: /etc/model-manager/oauth-client/client-secret}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: oauth-client
            secret:
              secretName: manager-oauth
              defaultMode: 0440
              items: [{key: google-client-secret, path: client-secret}]
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH_GOOGLE_REDIRECT_URL, value: https://manager.example.test/oauth/callback}
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="OAUTH_TRUSTED_ISSUERS")].value
          value: '[{"acceptedTypHeaders":["JWT"],"audiences":["google-client"],"issuer":"https://accounts.google.com","jwksURI":"https://www.googleapis.com/oauth2/v3/certs","openIDProvider":true}]'
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content: {name: OAUTH_DEX_ISSUER_URL}

  - it: reads the Google client ID from the Secret without a value
    set:
      oauth.provider: google
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAUTH_GOOGLE_CLIENT_ID
            valueFrom:
              secretKeyRef: {name: manager-oauth, key: google-client-id}

  - it: passes public client registration when allowed
    set:
      oauth.allowPublicClientRegistration: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH_ALLOW_PUBLIC_CLIENT_REGISTRATION, value: "true"}

  - it: still accepts the deprecated no-op values and passes nothing for them
    set:
      oauth.dex.allowPrivateURLs: true
      oauth.sso.allowPrivateIPs: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --allow-private-oauth-urls=true
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --sso-allow-private-ips=true

  - it: renders no OAuth settings with OAuth off
    set:
      oauth.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content: {name: OAUTH_ISSUER}
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content: {name: oauth-client}
