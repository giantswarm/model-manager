# Default values for model-manager.

# -- Platform-wide values an umbrella chart (agent-platform-standalone) shares
# with every component; Helm forwards them to this chart. `oauth.*` reads the
# identity contract as its defaults: `global.identity.issuerUrl`,
# `global.identity.clientId`, `global.identity.existingSecret`,
# `global.identity.ca.secretName` / `.key`, and `global.domain` for the OAuth
# base URL. Empty here; a standalone install sets `oauth.*` directly.
global: {}  # @schema type: object; additionalProperties: true

# -- Number of replicas. Jobs are tracked in memory, so keep this at 1 unless
# clients pin to one pod.
replicaCount: 1

image:
  # -- Image registry.
  registry: gsoci.azurecr.io
  # -- Image repository.
  repository: giantswarm/model-manager
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart appVersion.
  tag: ""

# -- Image pull secrets.
imagePullSecrets: []
# -- Override the chart name.
nameOverride: ""
# -- Override the fully qualified release name (the umbrella chart pins the
# Service name through this).
fullnameOverride: ""

# -- Serving backend driver: `ollama` (host Ollama — laptop/agentlab dev loop),
# `kserve` (KServe/vLLM on GPU installs: InferenceServices from serving
# presets, per-node Hugging Face cache, pre-warm download Jobs, fit checks) or
# `lemonade` (a Lemonade Server on the host — FastFlowLM on AMD Ryzen AI NPUs,
# llama.cpp on GPU and CPU; the same proxying shape as ollama). The API reports
# the backend and its capability flags at /api/v1/backend. The one-backend form
# of `backends`.
backend: ollama

# -- Serving backends to run at once, in the operator's order — one process in
# front of several servers, for example `[ollama, lemonade]` on a host running
# both. Each driver at most once; every listed driver reads its own block
# (`ollama.*`, `lemonade.*`, `kserve.*`). The first is the default backend: the
# one `GET /api/v1/backend` describes and an unqualified pull goes to; every
# model, job and node the API returns names its backend, every request may
# name one (`GET /api/v1/backends` lists them). Empty runs `backend` alone.
backends: []  # @schema item: string; itemEnum: [ollama, kserve, lemonade]; uniqueItems: true

ollama:
  # -- Ollama API base URL as reached from pods. On kind this is the docker
  # network gateway (for example http://172.21.0.1:11434 — agentlab sets it);
  # Docker Desktop resolves host.docker.internal.
  endpoint: http://host.docker.internal:11434
  # -- Ollama host written into kagent ModelConfigs, as reached by agent pods;
  # reported as `agentEndpoint` by `GET /api/v1/backend`. Empty means the same
  # as `ollama.endpoint`.
  agentHost: ""
  # -- Memory budget of the proxied host in GiB (a number; decimals allowed,
  # also as a string so `--set` can carry them), reported as `budgetBytes` on
  # `GET /api/v1/nodes` with `budgetSource: override` instead of `MemTotal` of
  # the pod's `/proc/meminfo` (`host-meminfo`). Set it where the pod's view is
  # not the host's: Docker Desktop or another VM-backed runtime (the pod sees
  # the VM's memory), an Ollama on another machine. 0 is off; a value that is
  # not a positive number of GiB is ignored and named in the node's `message`.
  # The ollama counterpart of the kserve node annotation
  # `model-manager.giantswarm.io/memory-budget-gib`.
  memoryBudgetGiB: 0  # @schema type: [number, string]; minimum: 0

lemonade:
  # -- Lemonade Server base URL as reached from pods (its API is under
  # `/api/v1`; Lemonade listens on 13305 by default). Bind Lemonade to every
  # interface (`lemonade config set host=0.0.0.0`, or `host` in its
  # config.json) so the kind docker network gateway reaches it, for example
  # http://172.21.0.1:13305; Docker Desktop resolves host.docker.internal.
  endpoint: http://host.docker.internal:13305
  # -- Lemonade Server base URL as reached by agent pods, written into kagent
  # ModelConfigs as the OpenAI-compatible `openAI.baseUrl` with `/api/v1`
  # appended; reported as `agentEndpoint` by `GET /api/v1/backend`. Empty
  # means the same as `lemonade.endpoint`.
  agentHost: ""

kagent:
  # -- Namespace where kagent ModelConfigs are created (RBAC is scoped here).
  namespace: kagent
  # -- kagent.dev API version for ModelConfigs; `auto` discovers the server's
  # preferred version.
  apiVersion: auto
  # -- Prefix for generated ModelConfig names (empty: the sanitized model name,
  # e.g. smollm2:135m -> smollm2-135m).
  modelConfigPrefix: ""
  # -- Create a ModelConfig automatically when a pull completes or a model is
  # loaded.
  autoWire: true
  # -- Disable all ModelConfig management; the `wire` capability reports false.
  # A release that runs the kserve backend keeps its Kubernetes access
  # (ServiceAccount token, RBAC) regardless — it needs the API for
  # InferenceServices, Jobs and nodes; only releases with the ollama and
  # lemonade backends alone run without the API when wiring is off.
  disableWiring: false

mcp:
  # -- Serve the MCP streamable-HTTP endpoint alongside the REST API.
  enabled: true
  # -- MCP endpoint path.
  path: /mcp

oauth:
  # -- Make model-manager an OAuth 2.1 resource server (mcp-oauth): the MCP
  # endpoint and the REST API require a bearer token the platform identity
  # provider issued, and every call carries the caller's identity (logged,
  # recorded as `requestedBy` on jobs). On the Agent Platform muster forwards
  # the session's IdP id_token to this server (MCPServer `auth.forwardToken`,
  # rendered below) and the portal sends the signed-in user's id_token through
  # the gateway; both are validated against the IdP's JWKS when their audience
  # is in `trustedAudiences`. Off: anonymous, acting as the ServiceAccount —
  # only for a server nothing but a trusted proxy can reach.
  enabled: false
  # -- Public base URL of this server: the issuer of its own OAuth metadata
  # (https, or http on loopback). Empty derives
  # `https://<fullname>.<global.domain>` when `global.domain` is set.
  baseURL: ""
  # -- Identity provider: `dex` or `google`.
  provider: dex
  dex:
    # -- Dex issuer URL. Empty falls back to `global.identity.issuerUrl`.
    issuerURL: ""
    # -- Dex OAuth client ID. Empty falls back to `global.identity.clientId`.
    clientID: ""
    # -- Dex OAuth client secret (prefer `oauth.existingSecret`).
    clientSecret: ""
    # -- Let the issuer resolve to a private or loopback address (an
    # in-cluster Dex).
    allowPrivateURLs: false
    # -- Secret with the CA of a Dex that serves a private certificate;
    # mounted and passed as `--dex-ca-file`. Empty name falls back to
    # `global.identity.ca.secretName` / `global.identity.ca.key`.
    caSecret:
      name: ""
      key: ca.crt
  google:
    # -- Google OAuth client ID (not secret; may also come from the Secret key
    # `google-client-id` when empty).
    clientID: ""
    # -- Google OAuth client secret (prefer `oauth.existingSecret`).
    clientSecret: ""
  # -- Existing Secret with the provider credentials: `dex-client-secret`
  # (dex) or `google-client-secret` (+ optional `google-client-id`) (google).
  # Empty falls back to `global.identity.existingSecret`, whose
  # `dex-client-secret` is the platform client's; without that, the chart
  # renders a Secret from the values above.
  existingSecret: ""
  # -- OAuth client IDs whose IdP id_tokens are accepted as bearer tokens (SSO
  # token forwarding). Empty falls back to `[global.identity.clientId]`, the
  # platform client MCP clients and the muster CLI log in with. The server
  # trusts the union of this list and `muster.mcpServer.auth.requiredAudiences`
  # (in that order, without duplicates): every token muster forwards carries
  # the required audiences by construction and they are what the
  # kube-apiserver trusts, so a portal session — whose id_token carries them
  # but not the platform client — is accepted without listing its client here.
  trustedAudiences: []
  sso:
    # -- Let the IdP's JWKS endpoint resolve to a private address when
    # validating forwarded tokens (an in-cluster Dex).
    allowPrivateIPs: false
  # -- Accept unauthenticated dynamic client registration (labs only).
  allowPublicClientRegistration: false
  downstream:
    # -- Call the Kubernetes API as the caller: everything a request does
    # (InferenceServices, download Jobs, cache scans, ModelConfigs) presents
    # the caller's IdP token, so the caller's RBAC governs — the apiserver
    # must trust the IdP and the token's audience (a Dex install lists that
    # audience in `muster.mcpServer.auth.requiredAudiences`; a Google install's
    # client id is the apiserver's `--oidc-client-id`). The ServiceAccount then
    # holds no permissions: the chart renders none of its Roles and
    # ClusterRoles (`rbac.create` is moot), work without a caller (download
    # adoption after a restart, the wiring reconciler) is off, and a job that
    # outlives its caller's token fails on the apiserver's 401 instead of
    # continuing with other credentials.
    enabled: false

muster:
  mcpServer:
    # -- Register this server with muster by rendering an
    # `mcpservers.muster.giantswarm.io` CR in the release namespace. Tools then
    # appear as `x_<name>_<tool>`.
    enabled: false
    # -- MCPServer CR name (drives the tool prefix).
    name: model-manager
    # -- Start the server connection when muster initializes.
    autoStart: true
    # -- Human-readable description shown by muster.
    description: Model management (inventory, pull, load/unload, delete, kagent wiring) for the Agent Platform
    # -- Extra labels on the MCPServer CR.
    labels: {}  # @schema additionalProperties: true
    # -- How muster authenticates to this server; rendered only with
    # `oauth.enabled`. `forwardToken` makes muster forward the session's IdP
    # id_token byte-identical (the SSO path this chart trusts through its
    # trusted audiences). `requiredAudiences` are extra audiences that token
    # must carry — the Dex cross-client audience the kube-apiserver trusts
    # (`dex-k8s-authenticator` on Giant Swarm clusters; agentlab's is
    # `kubernetes`) so `oauth.downstream` works; muster requests them at
    # login, so users re-login after a change. They are trusted as bearer
    # audiences by construction, since the server's trusted audiences are
    # `oauth.trustedAudiences` plus this list. A Google IdP has no
    # cross-client audiences: leave the list empty.
    auth:
      forwardToken: true
      requiredAudiences: []

httpRoute:
  # -- Expose the service through a Gateway API HTTPRoute.
  enabled: false
  # -- parentRefs of the HTTPRoute (required when enabled).
  parentRefs: []  # @schema item: object ; itemProperties: {name: {type: string}, namespace: {type: string}, sectionName: {type: string}, kind: {type: string}, group: {type: string}, port: {type: integer}}
  # -- Hostnames matched by the route.
  hostnames: []
  # -- Annotations on the HTTPRoute.
  annotations: {}  # @schema additionalProperties: true
  # -- Labels on the HTTPRoute.
  labels: {}  # @schema additionalProperties: true

networkPolicy:
  # -- Create a Kubernetes NetworkPolicy for the pod.
  enabled: false
  # -- Namespaces allowed to reach the API (label kubernetes.io/metadata.name).
  # Empty allows ingress from the release namespace only.
  ingressNamespaces: []
  # -- Extra egress CIDRs (the host Ollama or Lemonade endpoint, e.g.
  # 172.21.0.1/32).
  egressCIDRs: []
  # -- Allow egress to the Kubernetes API server (needed for wiring and by the
  # kserve backend).
  allowKubeAPI: true

serviceAccount:
  # -- Create a ServiceAccount.
  create: true
  # -- Annotations on the ServiceAccount.
  annotations: {}  # @schema additionalProperties: true
  # -- ServiceAccount name (generated when empty).
  name: ""

rbac:
  # -- Create the Role/RoleBinding for ModelConfigs and Secrets in
  # `kagent.namespace` (and, when kserve is among the backends, the Role in the
  # serving namespace, the Role for the discovery/preset ConfigMaps and the
  # ClusterRole for nodes and PersistentVolumes) — the ServiceAccount's own
  # permissions. Ignored with `oauth.downstream.enabled`: the ServiceAccount
  # then gets no RBAC at all.
  create: true

kserve:
  # -- Serving namespace: InferenceServices, download Jobs, cache-tool pods and
  # the cache claim live here and the kserve RBAC Role is created here. Must
  # match the platform's `components.modelServing.namespace.name`.
  namespace: model-serving
  discovery:
    # -- Name of the platform's model-serving discovery ConfigMap (kind
    # `ModelServingConfig`, key `config.yaml`) that carries the runtime, GPU
    # resource name, cache claim and preset selector. Empty `kserve.*`
    # overrides below take their value from it.
    configMap: agent-platform-model-serving
    # -- Namespace of the discovery ConfigMap and, by default, of the preset
    # ConfigMaps. Empty means the release namespace.
    namespace: ""
  # -- ClusterServingRuntime for presets that name none; empty takes the
  # discovery value (default `kserve-vllm`).
  runtime: ""
  # -- Accelerator resource name; empty takes the discovery value (default
  # `nvidia.com/gpu`).
  gpuResourceName: ""
  cache:
    # -- PersistentVolumeClaim of the Hugging Face cache in the serving
    # namespace; empty takes the discovery value (default `hf-cache`).
    claimName: ""
    # -- Where predictors mount the cache; empty takes the discovery value
    # (default `/mnt/models`).
    mountPath: ""
    # -- Nodes that hold the cache. Empty derives them from the node affinity
    # of the PersistentVolume bound to the claim (a static local PV pins the
    # cache to its node).
    nodes: []
    # -- ConfigMap in the serving namespace that remembers which Hugging Face
    # repository filled which cache directory: recorded while an
    # InferenceService serves from the directory (its name), kept after the
    # InferenceService is gone, so the directory keeps its repository and
    # preset in the inventory. The kserve Role grants `create` on ConfigMaps
    # and `update`/`patch` on this name.
    indexConfigMap: model-manager-cache-index
  presets:
    # -- Namespace of the serving-preset ConfigMaps; empty takes the discovery
    # value, else `kserve.discovery.namespace`.
    namespace: ""
    # -- Label selector of the serving-preset ConfigMaps; empty takes the
    # discovery value (default `agent-platform.giantswarm.io/serving-preset=true`).
    labelSelector: ""
  hf:
    # -- Hugging Face Hub base URL (search, repository metadata, sizes).
    endpoint: https://huggingface.co
    tokenSecret:
      # -- Secret in the serving namespace holding a Hugging Face token for
      # gated repositories (read by model-manager, mounted into download
      # Jobs). Empty: anonymous hub access, gated models refused.
      name: ""
      # -- Key of the token in that Secret.
      key: token
    # -- Render the token Secret (`kserve.hf.tokenSecret.name`, in the serving
    # namespace) from this value. Prefer a pre-created Secret; this is for
    # installs whose values are already secret-managed.
    token: ""
  download:
    # -- Image of the pre-warm download Job. The KServe storage-initializer
    # downloads exactly what an InferenceService would, so a later start finds
    # the files and skips the download.
    image:
      registry: docker.io
      name: kserve/storage-initializer
      tag: v0.20.0
    # -- File patterns downloads skip (fnmatch, passed as
    # STORAGE_IGNORE_PATTERNS). Empty downloads the whole repository like an
    # InferenceService does.
    ignorePatterns: []
    # -- ttlSecondsAfterFinished of download Jobs.
    jobTTL: 1h
  inventory:
    # -- How the per-node cache contents are read. `pod`: a short-lived scan
    # pod per cache node whenever the inventory is older than `ttl` (no
    # long-running pods, but pod churn in the serving namespace). `daemonset`:
    # the chart renders a DaemonSet (`kserve.inventory.agent.*`) in the
    # serving namespace running `model-manager cache-agent`, which mounts the
    # cache claim read-only and serves its contents over HTTP; model-manager
    # asks the agent on the node instead of creating pods. Requires
    # `kserve.cache.claimName` (the DaemonSet mounts the claim; the chart
    # cannot read the discovery ConfigMap). Deletes still use a one-shot pod.
    mode: pod
    agent:
      # -- Port the cache agent listens on.
      port: 8081
      # -- Node selector of the DaemonSet. A node-local cache claim (static
      # local PV, local-path) can only be mounted on its node: select it.
      nodeSelector: {}  # @schema additionalProperties: true
      # -- Tolerations of the agent pods (GPU node taints).
      tolerations: []  # @schema item: object ; itemProperties: {key: {type: string}, operator: {type: string}, value: {type: string}, effect: {type: string}, tolerationSeconds: {type: integer}}
      # -- Resources of the agent container (a scan walks file metadata only).
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 256Mi
      # -- Annotations on the agent pods.
      podAnnotations: {}  # @schema additionalProperties: true
      # -- Extra labels on the agent pods.
      podLabels: {}  # @schema additionalProperties: true
    # -- Image that creates cache directories (download Job init container)
    # and scans / cleans the cache (short-lived pods); needs sh, find, stat,
    # awk (busybox).
    image:
      registry: gsoci.azurecr.io
      name: giantswarm/alpine
      tag: 3.22.1
    # -- How long one cache scan is reused before a node is scanned again.
    ttl: 2m
    # -- Time budget of one scan (scan pod, or cache-agent request).
    timeout: 2m
  budget:
    # -- Node memory budget for fit checks: `auto` (GPU memory from the
    # nvidia.com/gpu.memory x gpu.count labels when present, else allocatable
    # memory — unified-memory nodes), `gpu-labels`, `allocatable`. A node
    # annotation `model-manager.giantswarm.io/memory-budget-gib: "96"` (GiB)
    # overrides the budget of that node whatever the source (reported as
    # `budgetSource: annotation`).
    source: auto
    # -- Serving overhead (KV cache, activations, runtime) added to the weights
    # when the preset has no `requirements.overheadGiB`.
    defaultOverheadGiB: 30
  # -- How long a load job waits for an InferenceService to become ready
  # before it gives up on wiring.
  readyTimeout: 2h

# -- Annotations on the pod.
podAnnotations: {}  # @schema additionalProperties: true
# -- Labels on the pod.
podLabels: {}  # @schema additionalProperties: true

# -- Pod security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port (container listens on 8080).
  port: 8080

# -- Container resources.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

logging:
  # -- Enable debug logging.
  verbose: false

# -- Extra container arguments.
extraArgs: []
# -- Extra environment variables.
extraEnv: []  # @schema item: object ; itemProperties: {name: {type: string}, value: {type: string}, valueFrom: {type: object, additionalProperties: true}}

# -- Node selector.
nodeSelector: {}  # @schema additionalProperties: true
# -- Tolerations.
tolerations: []  # @schema item: object ; itemProperties: {key: {type: string}, operator: {type: string}, value: {type: string}, effect: {type: string}, tolerationSeconds: {type: integer}}
# -- Affinity.
affinity: {}  # @schema additionalProperties: true
