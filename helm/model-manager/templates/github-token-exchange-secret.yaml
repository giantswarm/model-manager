{{- if and (include "model-manager.githubTokenExchange" .) (not .Values.github.tokenExchange.existingSecret) }}
{{- /*
The token exchange client's credentials when no existing Secret is named.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "model-manager.githubTokenExchangeSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "model-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.github.tokenExchange.clientSecret | quote }}
  {{- with .Values.github.tokenExchange.clientID }}
  client-id: {{ . | quote }}
  {{- end }}
{{- end }}
