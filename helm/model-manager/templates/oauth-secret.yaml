{{- if include "model-manager.oauthRendersSecret" . }}
{{- /*
Provider credentials when no existing Secret is named (neither
oauth.existingSecret nor the platform's global.identity.existingSecret).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "model-manager.fullname" . }}-oauth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "model-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq .Values.oauth.provider "google" }}
  google-client-secret: {{ required "oauth.google.clientSecret or oauth.existingSecret is required when oauth.enabled with the google provider" .Values.oauth.google.clientSecret | quote }}
  {{- with .Values.oauth.google.clientID }}
  google-client-id: {{ . | quote }}
  {{- end }}
  {{- else }}
  dex-client-secret: {{ required "oauth.dex.clientSecret or oauth.existingSecret is required when oauth.enabled" .Values.oauth.dex.clientSecret | quote }}
  {{- end }}
{{- end }}
