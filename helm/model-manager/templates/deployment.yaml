apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "model-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "model-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "model-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "model-manager.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "model-manager.serviceAccountName" . }}
      {{- /*
      Kubernetes access. The kserve driver talks to the API for everything it
      does (InferenceServices, download Jobs, cache scans, nodes), so it keeps
      the ServiceAccount token even with kagent.disableWiring: that flag only
      switches off the ModelConfig management. Only the ollama driver runs
      without the API once wiring is off; without the token the kserve pod
      fails with "the kserve backend needs Kubernetes access" and crash-loops.
      rbac.yaml follows the same rule (the kserve Roles render regardless of
      kagent.disableWiring).
      */}}
      {{- $kubeAccess := or (eq .Values.backend "kserve") (not .Values.kagent.disableWiring) }}
      automountServiceAccountToken: {{ $kubeAccess }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --listen=:8080
            - --backend={{ .Values.backend }}
            {{- if eq .Values.backend "ollama" }}
            - --ollama-endpoint={{ required "ollama.endpoint is required for the ollama backend" .Values.ollama.endpoint }}
            {{- if .Values.ollama.agentHost }}
            - --ollama-agent-host={{ .Values.ollama.agentHost }}
            {{- end }}
            {{- if .Values.ollama.memoryBudgetGiB }}
            - --ollama-memory-budget-gib={{ .Values.ollama.memoryBudgetGiB }}
            {{- end }}
            {{- end }}
            {{- if eq .Values.backend "kserve" }}
            {{- $k := .Values.kserve }}
            - --kserve-namespace={{ include "model-manager.kserveNamespace" . }}
            - --kserve-discovery-configmap={{ $k.discovery.configMap }}
            - --kserve-discovery-namespace={{ include "model-manager.kserveDiscoveryNamespace" . }}
            {{- with $k.runtime }}
            - --kserve-runtime={{ . }}
            {{- end }}
            {{- with $k.gpuResourceName }}
            - --kserve-gpu-resource={{ . }}
            {{- end }}
            {{- with $k.cache.claimName }}
            - --kserve-cache-claim={{ . }}
            {{- end }}
            {{- with $k.cache.mountPath }}
            - --kserve-cache-mount-path={{ . }}
            {{- end }}
            {{- with $k.cache.nodes }}
            - --kserve-cache-nodes={{ join "," . }}
            {{- end }}
            {{- with $k.cache.indexConfigMap }}
            - --kserve-cache-index-configmap={{ . }}
            {{- end }}
            {{- with $k.presets.namespace }}
            - --kserve-preset-namespace={{ . }}
            {{- end }}
            {{- with $k.presets.labelSelector }}
            - --kserve-preset-selector={{ . }}
            {{- end }}
            - --kserve-hf-endpoint={{ $k.hf.endpoint }}
            {{- with $k.hf.tokenSecret.name }}
            - --kserve-hf-token-secret={{ . }}
            - --kserve-hf-token-secret-key={{ $k.hf.tokenSecret.key }}
            {{- end }}
            - --kserve-download-image={{ $k.download.image.registry }}/{{ $k.download.image.name }}:{{ $k.download.image.tag }}
            {{- with $k.download.ignorePatterns }}
            - --kserve-download-ignore-patterns={{ join "," . }}
            {{- end }}
            - --kserve-job-ttl={{ $k.download.jobTTL }}
            - --kserve-init-image={{ $k.inventory.image.registry }}/{{ $k.inventory.image.name }}:{{ $k.inventory.image.tag }}
            - --kserve-inventory-ttl={{ $k.inventory.ttl }}
            - --kserve-inventory-timeout={{ $k.inventory.timeout }}
            - --kserve-inventory-mode={{ $k.inventory.mode }}
            {{- if eq $k.inventory.mode "daemonset" }}
            - --kserve-inventory-agent-selector={{ include "model-manager.cacheAgentSelector" . }}
            - --kserve-inventory-agent-port={{ $k.inventory.agent.port }}
            {{- end }}
            - --kserve-budget-source={{ $k.budget.source }}
            - --kserve-default-overhead-gib={{ $k.budget.defaultOverheadGiB }}
            - --kserve-ready-timeout={{ $k.readyTimeout }}
            {{- end }}
            {{- if $kubeAccess }}
            - --in-cluster=true
            {{- end }}
            {{- if .Values.kagent.disableWiring }}
            - --disable-wiring=true
            {{- else }}
            - --kagent-namespace={{ .Values.kagent.namespace }}
            - --kagent-api-version={{ .Values.kagent.apiVersion }}
            - --auto-wire={{ .Values.kagent.autoWire }}
            {{- if .Values.kagent.modelConfigPrefix }}
            - --modelconfig-prefix={{ .Values.kagent.modelConfigPrefix }}
            {{- end }}
            {{- end }}
            - --mcp-enabled={{ .Values.mcp.enabled }}
            - --mcp-path={{ .Values.mcp.path }}
            {{- if .Values.oauth.enabled }}
            - --enable-oauth=true
            - --oauth-base-url={{ include "model-manager.oauthBaseURL" . }}
            - --oauth-provider={{ .Values.oauth.provider }}
            {{- with include "model-manager.oauthTrustedAudiences" . }}
            - --oauth-trusted-audiences={{ . }}
            {{- end }}
            {{- if .Values.oauth.sso.allowPrivateIPs }}
            - --sso-allow-private-ips=true
            {{- end }}
            {{- if .Values.oauth.allowPublicClientRegistration }}
            - --allow-public-client-registration=true
            {{- end }}
            {{- if .Values.oauth.downstream.enabled }}
            - --downstream-oauth=true
            {{- end }}
            {{- if eq .Values.oauth.provider "dex" }}
            - --dex-issuer-url={{ include "model-manager.oauthDexIssuerURL" . }}
            - --dex-client-id={{ include "model-manager.oauthDexClientID" . }}
            {{- if .Values.oauth.dex.allowPrivateURLs }}
            - --allow-private-oauth-urls=true
            {{- end }}
            {{- if include "model-manager.oauthDexCASecretName" . }}
            - --dex-ca-file=/etc/model-manager/idp-ca/{{ include "model-manager.oauthDexCASecretKey" . }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.logging.verbose }}
            - --verbose
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.oauth.enabled .Values.extraEnv }}
          env:
            {{- if .Values.oauth.enabled }}
            {{- if eq .Values.oauth.provider "google" }}
            {{- if .Values.oauth.google.clientID }}
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.oauth.google.clientID | quote }}
            {{- else }}
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "model-manager.oauthSecretName" . }}
                  key: google-client-id
            {{- end }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "model-manager.oauthSecretName" . }}
                  key: google-client-secret
            {{- else }}
            - name: DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "model-manager.oauthSecretName" . }}
                  key: dex-client-secret
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $idpCA := "" }}
          {{- if and .Values.oauth.enabled (eq .Values.oauth.provider "dex") }}{{ $idpCA = include "model-manager.oauthDexCASecretName" . }}{{ end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $idpCA }}
            - name: idp-ca
              mountPath: /etc/model-manager/idp-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $idpCA }}
        - name: idp-ca
          secret:
            secretName: {{ $idpCA }}
            items:
              - key: {{ include "model-manager.oauthDexCASecretKey" . }}
                path: {{ include "model-manager.oauthDexCASecretKey" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
