{{- if and (eq .Values.backend "kserve") .Values.kserve.hf.token .Values.kserve.hf.tokenSecret.name }}
{{- /*
Hugging Face token for gated repositories, in the serving namespace: read by
model-manager for hub metadata and mounted into download Jobs. Prefer a
pre-created Secret (kserve.hf.tokenSecret.name alone); this template is for
installs whose values are already secret-managed.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.kserve.hf.tokenSecret.name }}
  namespace: {{ include "model-manager.kserveNamespace" . }}
  labels:
    {{- include "model-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.kserve.hf.tokenSecret.key }}: {{ .Values.kserve.hf.token | quote }}
{{- end }}
