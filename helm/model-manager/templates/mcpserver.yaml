{{- if .Values.muster.mcpServer.enabled }}
{{- /*
Registers this server with muster. Tools appear as x_<name>_<tool>. With
oauth.enabled the CR carries the auth block: muster forwards the session's IdP
id_token (forwardToken), which this server validates against its trusted
audiences (oauth.trustedAudiences plus the requiredAudiences below), and
requests the requiredAudiences at login. Without OAuth muster connects
anonymously.
*/}}
apiVersion: muster.giantswarm.io/v1alpha1
kind: MCPServer
metadata:
  name: {{ .Values.muster.mcpServer.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    muster.giantswarm.io/type: model-manager
    {{- include "model-manager.labels" . | nindent 4 }}
    {{- with .Values.muster.mcpServer.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  autoStart: {{ .Values.muster.mcpServer.autoStart }}
  type: streamable-http
  url: http://{{ include "model-manager.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}{{ .Values.mcp.path }}
  {{- with .Values.muster.mcpServer.description }}
  description: {{ . | quote }}
  {{- end }}
  {{- if .Values.oauth.enabled }}
  auth:
    type: oauth
    forwardToken: {{ .Values.muster.mcpServer.auth.forwardToken }}
    {{- with .Values.muster.mcpServer.auth.requiredAudiences }}
    requiredAudiences:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
