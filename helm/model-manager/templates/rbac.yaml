{{- /*
No RBAC at all with oauth.downstream: every Kubernetes call then carries the
caller's IdP token and the caller's RBAC governs; the ServiceAccount keeps only
what every authenticated principal has (API discovery). The token stays
mounted for the in-cluster API address and CA.
*/}}
{{- $rbac := and .Values.rbac.create (not (and .Values.oauth.enabled .Values.oauth.downstream.enabled)) }}
{{- if and $rbac (not .Values.kagent.disableWiring) }}
{{- /*
Agent wiring: model-manager creates, updates and deletes kagent ModelConfigs
(and placeholder API-key Secrets for OpenAI-compatible endpoints) in
kagent.namespace only. Discovery of the preferred kagent.dev API version needs
no extra permission.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "model-manager.fullname" . }}-kagent
  namespace: {{ .Values.kagent.namespace }}
  labels:
    {{- include "model-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kagent.dev"]
    resources: ["modelconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "model-manager.fullname" . }}-kagent
  namespace: {{ .Values.kagent.namespace }}
  labels:
    {{- include "model-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "model-manager.fullname" . }}-kagent
subjects:
  - kind: ServiceAccount
    name: {{ include "model-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and $rbac (eq .Values.backend "kserve") }}
{{- /*
KServe backend, in the serving namespace: InferenceServices; download Jobs and
their pods (progress from pod logs); the short-lived cache-tool pods that scan
and clean the cache claim; the claim itself; the cache index ConfigMap
model-manager writes (create cannot be limited to a name, update and patch
are); the optional hub-token Secret. In the discovery / preset namespace: the
ModelServingConfig and ServingPreset ConfigMaps. Cluster-wide: nodes (memory
budgets, GPU labels) and PersistentVolumes (which node holds the cache).
*/}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "model-manager.fullname" . }}-kserve
  namespace: {{ include "model-manager.kserveNamespace" . }}
  labels:
    {{- include "model-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["servingruntimes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch"]
  {{- with .Values.kserve.cache.indexConfigMap }}
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ . | quote }}]
    verbs: ["update", "patch"]
  {{- end }}
  {{- with .Values.kserve.hf.tokenSecret.name }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ . | quote }}]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "model-manager.fullname" . }}-kserve
  namespace: {{ include "model-manager.kserveNamespace" . }}
  labels:
    {{- include "model-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "model-manager.fullname" . }}-kserve
subjects:
  - kind: ServiceAccount
    name: {{ include "model-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- $discoveryNs := include "model-manager.kserveDiscoveryNamespace" . }}
{{- $presetNs := include "model-manager.kservePresetNamespace" . }}
{{- range $ns := (list $discoveryNs $presetNs | uniq) }}
{{- if ne $ns (include "model-manager.kserveNamespace" $) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "model-manager.fullname" $ }}-kserve-config
  namespace: {{ $ns }}
  labels:
    {{- include "model-manager.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "model-manager.fullname" $ }}-kserve-config
  namespace: {{ $ns }}
  labels:
    {{- include "model-manager.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "model-manager.fullname" $ }}-kserve-config
subjects:
  - kind: ServiceAccount
    name: {{ include "model-manager.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "model-manager.fullname" . }}-nodes
  labels:
    {{- include "model-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "model-manager.fullname" . }}-nodes
  labels:
    {{- include "model-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "model-manager.fullname" . }}-nodes
subjects:
  - kind: ServiceAccount
    name: {{ include "model-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
