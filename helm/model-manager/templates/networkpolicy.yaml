{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "model-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "model-manager.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "model-manager.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.allowKubeAPI }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    {{- end }}
    {{- with include "model-manager.otlpTarget" . }}
    {{- $target := splitList ":" . }}
    # The OTLP collector (observability.otel.endpoint): its namespace for an
    # in-cluster Service, any address otherwise.
    - to:
        {{- with first $target }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- else }}
        - ipBlock:
            cidr: 0.0.0.0/0
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ last $target }}
    {{- end }}
    {{- range .Values.networkPolicy.egressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
    {{- end }}
    {{- if include "model-manager.hasBackend" (dict "root" . "name" "kserve") }}
    # The served models' runtimes, in the serving namespace: GET /version and
    # GET /openapi.json of a Ready LLMInferenceService's workload, the API
    # interfaces it answers.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "model-manager.kserveNamespace" . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: llminferenceservice
      ports:
        - protocol: TCP
          port: 8000
    {{- end }}
    {{- if and (include "model-manager.hasBackend" (dict "root" . "name" "kserve")) (eq .Values.kserve.inventory.mode "daemonset") }}
    # The cache-agent pods of the DaemonSet inventory, in the serving namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "model-manager.kserveNamespace" . }}
          podSelector:
            matchLabels:
              {{- include "model-manager.cacheAgentSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.kserve.inventory.agent.port }}
    {{- end }}
{{- if and (include "model-manager.hasBackend" (dict "root" . "name" "kserve")) (eq .Values.kserve.inventory.mode "daemonset") }}
---
# The cache-agent pods accept model-manager only (kubelet probes come from
# the node and are not subject to NetworkPolicy in the common implementations).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "model-manager.fullname" . }}-cache-agent
  namespace: {{ include "model-manager.kserveNamespace" . }}
  labels:
    {{- include "model-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache-agent
spec:
  podSelector:
    matchLabels:
      {{- include "model-manager.cacheAgentSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "model-manager.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.kserve.inventory.agent.port }}
{{- end }}
{{- end }}
