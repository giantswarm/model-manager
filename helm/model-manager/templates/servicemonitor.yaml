{{- if and .Values.observability.metrics.enabled .Values.serviceMonitor.enabled }}
{{- $tenant := required "serviceMonitor.labels[observability.giantswarm.io/tenant] must be set" (index .Values.serviceMonitor.labels "observability.giantswarm.io/tenant") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "model-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "model-manager.labels" . | nindent 4 }}
    observability.giantswarm.io/tenant: {{ $tenant | quote }}
    {{- with omit .Values.serviceMonitor.labels "observability.giantswarm.io/tenant" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "model-manager.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      {{- with .Values.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
{{- end }}
