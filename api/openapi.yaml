openapi: 3.1.0
info:
  title: model-manager API
  version: 1.0.0
  description: |
    Backend-agnostic model management for the Giant Swarm Agent Platform.

    One API implemented by serving backends (`ollama` for laptop/agentlab
    installs, `kserve` for GPU installs, `lemonade` for hosts running Lemonade
    Server — FastFlowLM on AMD Ryzen AI NPUs, llama.cpp on GPU and CPU). One
    model-manager runs one or several of them at once (`--backends`, chart
    value `backends`). Clients MUST call `GET /api/v1/backends` first and
    render only what each backend's capability flags allow: a false flag
    means the matching operation answers `501 unsupported` on that backend.
    `GET /api/v1/backend` stays for clients of one backend: it describes the
    default backend (the first configured) and names the others in
    `backends`.

    Every model, loaded entry, job, node, preset, fit result and ModelConfig
    reference carries `backend`. Reads take an optional `?backend=` filter and
    otherwise aggregate every backend — a backend that fails to answer is
    reported in the response's `errors` while the others' items are returned
    (`502` only when every backend failed). Mutations take an optional
    `backend` in the body (or query, on `DELETE /api/v1/models/{name}`); a
    request without it is resolved to the one backend holding the reference —
    a reference that exists on several backends answers `409 conflict` (name
    the backend), one on none `404`. A pull without `backend` goes to the
    default backend. An unknown or unconfigured backend name answers `400
    invalid_request`, listing the configured ones.

    Model references are backend-native strings and may contain `/` and `:`
    (e.g. `smollm2:135m`, `hf.co/org/repo:Q4_K_M`). Path parameters therefore
    capture the remainder of the path; mutating operations take the reference
    in a JSON body instead.

    The same operations are available as MCP tools (streamable HTTP at `/mcp`,
    tool names in `x-mcp-tool` below; through muster they appear as
    `x_<server>_<tool>`).

    The `kserve` backend adds, behind its capability flags: serving presets
    (`GET /api/v1/presets`), hub search (`GET /api/v1/search`), a fit check
    (`POST /api/v1/models/fit-check`) and the per-node budget / cache view
    (`GET /api/v1/nodes`). On kserve, pull and load accept `preset` and `node`,
    a refused fit answers `412 does_not_fit`, and a `load` job follows a served
    model to readiness before wiring it into kagent.
servers:
  - url: /
tags:
  - name: backend
  - name: models
  - name: jobs
  - name: wiring
  - name: serving
    description: kserve capabilities (presets, search, fit check, nodes)
  - name: health
paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      operationId: healthz
      responses:
        "200":
          description: alive
          content:
            text/plain:
              schema: { type: string, example: ok }
  /readyz:
    get:
      tags: [health]
      summary: Readiness (the API is serving)
      description: |
        Does not depend on the serving backend: with the host Ollama or Lemonade Server down the
        API stays reachable and `GET /api/v1/backend` reports `healthy: false`.
      operationId: readyz
      responses:
        "200":
          description: serving
  /backendz:
    get:
      tags: [health]
      summary: Backend reachability probe (503 when a serving backend does not answer)
      description: 200 only when every configured backend answers; the 503 body names the ones that do not.
      operationId: backendz
      responses:
        "200":
          description: every backend answers
        "503":
          description: a backend is unreachable
  /api/v1/backends:
    get:
      tags: [backend]
      summary: Every configured backend, in order, each with its own health, capability flags, endpoints and load semantics
      description: |
        The first entry is the default backend. Clients build one group of
        models per backend from these descriptors and the `backend` field on
        every model; the capability flags of the model's own backend decide
        which controls render for it.
      operationId: listBackends
      x-mcp-tool: list_backends
      responses:
        "200":
          description: backend descriptors
          content:
            application/json:
              schema:
                type: object
                required: [backends]
                properties:
                  backends:
                    type: array
                    items: { $ref: "#/components/schemas/Backend" }
  /api/v1/backend:
    get:
      tags: [backend]
      summary: One backend — the named one, else the default — plus the names of every configured backend
      description: |
        `endpoint` is the backend as model-manager dials it; `agentEndpoint`
        the backend as agent pods dial it (what ModelConfigs point at), when
        the backend has one. Render controls per capability flag. `loading`
        says how the backend brings models into memory and lets them go —
        use it to word a not-loaded model ("loads on first request" versus
        "not serving"), never the backend name. `backends` names every
        configured backend; a client that sees more than one switches to
        `GET /api/v1/backends`.
      operationId: getBackend
      x-mcp-tool: get_backend
      parameters:
        - $ref: "#/components/parameters/BackendQuery"
      responses:
        "200":
          description: backend descriptor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backend" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
  /api/v1/openapi.yaml:
    get:
      tags: [backend]
      summary: This document
      operationId: getOpenAPI
      responses:
        "200":
          description: OpenAPI document
          content:
            application/yaml:
              schema: { type: string }
  /api/v1/models:
    get:
      tags: [models]
      summary: Downloaded models (inventory) of one or every backend, enriched with loaded state and ModelConfig
      operationId: listModels
      x-mcp-tool: list_models
      parameters:
        - $ref: "#/components/parameters/BackendQuery"
      responses:
        "200":
          description: inventory; `errors` names the backends that could not be read (their models are missing)
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items: { $ref: "#/components/schemas/Model" }
                  errors: { $ref: "#/components/schemas/BackendErrors" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "502": { $ref: "#/components/responses/BackendError" }
  /api/v1/models/{name}:
    parameters:
      - $ref: "#/components/parameters/ModelName"
      - $ref: "#/components/parameters/BackendQuery"
    get:
      tags: [models]
      summary: One downloaded model
      operationId: getModel
      x-mcp-tool: get_model
      responses:
        "200":
          description: model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Ambiguous" }
        "502": { $ref: "#/components/responses/BackendError" }
    delete:
      tags: [models]
      summary: Delete a downloaded model (and by default its ModelConfig)
      operationId: deleteModel
      x-mcp-tool: delete_model
      parameters:
        - name: unwire
          in: query
          description: Also remove the ModelConfig. Default true.
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  backend: { type: string, description: the backend the model was deleted from }
                  model: { type: string }
                  deleted: { type: boolean }
                  unwired: { type: boolean }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Ambiguous" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "502": { $ref: "#/components/responses/BackendError" }
  /api/v1/loaded:
    get:
      tags: [models]
      summary: Models currently loaded / serving, on one or every backend that lists them
      operationId: listLoaded
      x-mcp-tool: list_loaded_models
      parameters:
        - $ref: "#/components/parameters/BackendQuery"
      responses:
        "200":
          description: loaded models; `errors` names the backends that could not be read
          content:
            application/json:
              schema:
                type: object
                required: [loaded]
                properties:
                  loaded:
                    type: array
                    items: { $ref: "#/components/schemas/LoadedModel" }
                  errors: { $ref: "#/components/schemas/BackendErrors" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "502": { $ref: "#/components/responses/BackendError" }
  /api/v1/models/pull:
    post:
      tags: [models, jobs]
      summary: Start importing a model; returns a job immediately
      description: |
        Starts a background import and returns `202` with the job. If an import
        of the same reference is already pending/running, that job is returned
        with `created: false`. Poll `GET /api/v1/jobs/{id}` for progress. On
        success the model is wired into kagent (job `result` carries the
        ModelConfig reference) unless `wire` is false or the server's autoWire
        is off. On kserve the job echoes `preset` and `node`: the values the
        request named right away, and the node model-manager picked itself
        once the fit check ran. The pull runs on `backend`, else on the
        default backend (the first configured): a pull names a model that
        does not exist yet, so nothing else can pick the backend.
      operationId: pullModel
      x-mcp-tool: pull_model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                backend: { $ref: "#/components/schemas/BackendName" }
                model:
                  type: string
                  description: "Model reference (ollama registry tag or hf.co/... GGUF ref; lemonade catalog model name such as Qwen3-0.6B-GGUF — `lemonade list`; kserve Hugging Face repository owner/name[:revision])"
                  example: smollm2:135m
                wire:
                  type: boolean
                  description: Create a ModelConfig on completion (ollama, lemonade; default = server autoWire; kserve refuses true — models are wired when served)
                preset:
                  type: string
                  description: kserve — the serving preset the download is for; its InferenceService mounts the resulting cache directory. Default = the single preset serving the model.
                node:
                  type: string
                  description: "kserve — node whose cache receives the download; must be eligible (GET /api/v1/nodes), else the job fails with does_not_fit and the eligibility reason. Default = the cache node, else the eligible node with the largest budget."
      responses:
        "202":
          description: job accepted (or joined)
          content:
            application/json:
              schema:
                type: object
                required: [job, created]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
                  created: { type: boolean }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "501": { $ref: "#/components/responses/Unsupported" }
  /api/v1/models/load:
    post:
      tags: [models]
      summary: Load a model into memory / start serving it
      description: |
        ollama: a keep-alive load that pre-warms the model — Ollama re-arms
        the eviction timer on every later request with that request's own
        keep-alive (or the server's `OLLAMA_KEEP_ALIVE` when it sends none),
        so the `keepAlive` given here holds only until the next inference
        request (`loading.keepAliveScope: request`). The response is the
        loaded model with `running.expiresAt`, the deadline Ollama reports
        right after the load. kserve: fit-checks the model, composes an
        InferenceService from the preset (the only way to serve on kserve) and
        creates it; the response has `loaded=true` with `running.status`
        `Pending` until the predictor is ready, and a `load` job (see
        `GET /api/v1/jobs`) follows readiness and wires the model into kagent.
        Loading an already-served preset again is a no-op. lemonade: `POST
        /api/v1/load` on the Lemonade Server, which starts the model's
        backend process (FastFlowLM on the NPU, llama.cpp, ...) and answers
        once it is ready — no keep-alive: the model stays until unloaded or
        until another model of its type needs the slot; `keepAlive: "-1"`
        pins it against that displacement, other values are ignored. The
        response is the loaded model with `running.device` and
        `running.pinned`.
      operationId: loadModel
      x-mcp-tool: load_model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                backend: { $ref: "#/components/schemas/BackendName" }
                model: { type: string, description: model reference; required unless preset is given }
                keepAlive:
                  type: string
                  description: |
                    ollama keep-alive after this load (duration such as 10m; -1 = forever).
                    Default = model-manager's `--default-keep-alive`, reported as
                    `loading.keepAliveDefault`. Later inference requests replace it
                    with their own keep-alive. lemonade: only `-1` has a meaning —
                    it pins the model against slot eviction; every other value is
                    ignored (no idle timer).
                preset:
                  type: string
                  description: kserve — serving preset to compose the InferenceService from. Default = the single preset serving the model.
                node:
                  type: string
                  description: "kserve — pin the predictor to this node; must be eligible (GET /api/v1/nodes), else 412 does_not_fit with the eligibility reason and no InferenceService is created."
      responses:
        "200":
          description: the loaded model — `loaded=true`, `running` as the backend reports it right after the load (ollama with `expiresAt`; lemonade with `device` and `pinned`; kserve with `status` Pending)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: an InferenceService of that name exists for another model or is not managed by model-manager; or the reference exists on several backends and none was named
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "412": { $ref: "#/components/responses/DoesNotFit" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "502": { $ref: "#/components/responses/BackendError" }
  /api/v1/models/fit-check:
    post:
      tags: [serving]
      summary: Check whether a model fits a node before downloading or serving it (kserve)
      description: |
        Resolves the weight size from the Hugging Face Hub
        (`model.safetensors.index.json`, else the file tree, else the preset's
        `weightsGiB`), adds the serving overhead (the preset's `overheadGiB`,
        default 30 GiB) and compares the sum with the memory budget of the
        target node (GPU memory from the node labels when present, else
        allocatable memory; the node annotation
        `model-manager.giantswarm.io/memory-budget-gib` overrides it —
        `budgetSource` says which applied). `fits=false` is a 200 with the
        explanation in `reason`; pull and load refuse such models with
        `412 does_not_fit`. A `node` that is not a serving target
        (`eligible: false` on `GET /api/v1/nodes`, or a CPU-only node that is
        not listed there) answers `fits=false` with the eligibility reason
        and no `node`; pull and load refuse it the same way, before any Job
        or InferenceService is created. Without a `node` only eligible nodes
        are considered.
      operationId: fitCheck
      x-mcp-tool: check_fit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                backend: { $ref: "#/components/schemas/BackendName", description: "the backend to check on; required only when several configured backends offer fit checks (else 409)" }
                model: { type: string, description: Hugging Face repository owner/name; required unless preset is given }
                preset: { type: string }
                node: { type: string, description: "node to check against — must be eligible (GET /api/v1/nodes); default = the eligible node with the most free budget, cache nodes first" }
      responses:
        "200":
          description: fit result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Ambiguous" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "502": { $ref: "#/components/responses/BackendError" }
  /api/v1/presets:
    get:
      tags: [serving]
      summary: Curated serving presets (kserve), of one or every backend that offers them
      description: |
        The published `ServingPreset` ConfigMaps of the platform
        (`agent-platform.giantswarm.io/serving-preset=true`), resolved to what a
        client needs to pick one: model, runtime, GPUs, weights + overhead
        requirements, arguments.
      operationId: listPresets
      x-mcp-tool: list_presets
      parameters:
        - $ref: "#/components/parameters/BackendQuery"
      responses:
        "200":
          description: presets
          content:
            application/json:
              schema:
                type: object
                required: [presets]
                properties:
                  presets:
                    type: array
                    items: { $ref: "#/components/schemas/Preset" }
                  errors: { $ref: "#/components/schemas/BackendErrors" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "502": { $ref: "#/components/responses/BackendError" }
  /api/v1/search:
    get:
      tags: [serving]
      summary: Search the model hub (kserve — Hugging Face Hub) of one or every backend that has one
      operationId: searchModels
      x-mcp-tool: search_models
      parameters:
        - $ref: "#/components/parameters/BackendQuery"
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        "200":
          description: search results, most downloaded first
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  query: { type: string }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }
                  errors: { $ref: "#/components/schemas/BackendErrors" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "502": { $ref: "#/components/responses/BackendError" }
  /api/v1/nodes:
    get:
      tags: [serving]
      summary: Node memory budgets, reservations and download caches
      description: |
        kserve: the accelerator nodes only — nodes that advertise the
        configured GPU resource (`gpuResourceName` of the discovery ConfigMap,
        default `nvidia.com/gpu`; capacity or allocatable > 0) or carry a
        gpu-feature-discovery label (`nvidia.com/gpu.present`, `.count`,
        `.product`); CPU-only nodes are not serving capacity and are left
        out. Each node comes with its memory budget for fit checks
        (`budgetSource`: `gpu-labels` from the NVIDIA feature-discovery labels,
        `allocatable` memory, or `annotation` when the node carries
        `model-manager.giantswarm.io/memory-budget-gib: "<GiB>"` — the
        per-node override for unified-memory nodes), what running models
        reserve, the download cache the node holds, and `eligible`: whether a
        model can be served there right now — the node is ready, inside the
        serving `nodeSelector` of the discovery ConfigMap, and can mount the
        cache claim whenever predictors mount it (cache enabled with
        `cache.redirectPolicy` on) and the claim is pinned to nodes (a static
        local PersistentVolume). `eligibilityReason` explains a false value,
        e.g. `outside the serving node selector
        (kubernetes.io/hostname=spark-8723); cache claim hf-cache is pinned to
        spark-8723` or `not ready`; pull, load and fit-check refuse such a
        node with that reason. `message` reports an ignored, unparsable
        annotation.

        ollama: one node, the proxied host (`name` = the host agents dial,
        e.g. `172.21.0.1`). Ollama's API has no capacity endpoint, so
        `budgetBytes` (= `allocatableMemoryBytes`) is `MemTotal` of
        `/proc/meminfo` as the model-manager pod sees it (`budgetSource:
        host-meminfo`; the machine's RAM when pod and Ollama share a kernel,
        the VM's under Docker Desktop or another VM-backed runtime) unless the
        operator set the chart value `ollama.memoryBudgetGiB`
        (`--ollama-memory-budget-gib`): then `budgetBytes` is that figure with
        `budgetSource: override` while `allocatableMemoryBytes` stays the
        pod's `MemTotal` — the counterpart of the kserve node annotation; a
        value that is not a positive number of GiB is ignored and named in
        `message`. `reservedBytes` is the sum of `size` over Ollama's `/api/ps`,
        `accelerated` says whether any loaded model has memory on an
        accelerator (`size_vram` > 0). `gpuCount` is 0 — accelerators are not
        observable through Ollama's API; the per-model share is
        `running.vramBytes` on `/models` and `/loaded` — and there is no
        `cache`. `message` explains the figures.

        lemonade: one node, the proxied host (`name` = the host agents dial),
        described by Lemonade's own `GET /api/v1/system-info`: `budgetBytes`
        (= `allocatableMemoryBytes`) is the host memory Lemonade reports
        (`budgetSource: system-info`), `gpuCount` and `gpuProduct` are the
        accelerators Lemonade found available — the NPU (named) and the GPUs
        — `reservedBytes` is the sum of the catalog sizes of the loaded models
        (Lemonade reports no per-model memory), and `cache` is Lemonade's
        model store (`mountPath`, the downloaded models and their sizes,
        `inventory: models`). Always eligible.
      operationId: listNodes
      x-mcp-tool: list_nodes
      parameters:
        - $ref: "#/components/parameters/BackendQuery"
      responses:
        "200":
          description: nodes of one or every backend that reports them; `errors` names the backends that could not be read
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/NodeInfo" }
                  errors: { $ref: "#/components/schemas/BackendErrors" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "502": { $ref: "#/components/responses/BackendError" }
  /api/v1/models/unload:
    post:
      tags: [models]
      summary: Unload a model from memory / stop serving it
      operationId: unloadModel
      x-mcp-tool: unload_model
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelRequest" }
      responses:
        "200":
          description: unloaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  backend: { type: string, description: the backend the model was unloaded from }
                  model: { type: string }
                  loaded: { type: boolean, const: false }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Ambiguous" }
        "501": { $ref: "#/components/responses/Unsupported" }
        "502": { $ref: "#/components/responses/BackendError" }
  /api/v1/models/wire:
    post:
      tags: [wiring]
      summary: Create or refresh the kagent ModelConfig for a downloaded model
      operationId: wireModel
      x-mcp-tool: wire_model
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelRequest" }
      responses:
        "200":
          description: wired
          content:
            application/json:
              schema:
                type: object
                properties:
                  backend: { type: string, description: the backend the model was wired on }
                  model: { type: string }
                  modelConfig: { $ref: "#/components/schemas/ModelConfigRef" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: a ModelConfig with the derived name exists but is not managed by model-manager; or the reference exists on several backends and none was named
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501": { $ref: "#/components/responses/Unsupported" }
  /api/v1/models/unwire:
    post:
      tags: [wiring]
      summary: Delete the ModelConfig model-manager created for a model (never one created by someone else)
      description: |
        Without `backend` the managed ModelConfigs are consulted first — the
        model may be gone from its backend: one backend wiring the reference
        is unambiguous, several answer `409`, none falls back to resolving the
        reference across backends (absent everywhere counts as success).
      operationId: unwireModel
      x-mcp-tool: unwire_model
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelRequest" }
      responses:
        "200":
          description: unwired (absent counts as success)
          content:
            application/json:
              schema:
                type: object
                properties:
                  backend: { type: string, description: the backend whose ModelConfig was removed; absent when nothing was found }
                  model: { type: string }
                  modelConfig: { type: "null" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "409": { $ref: "#/components/responses/Ambiguous" }
        "501": { $ref: "#/components/responses/Unsupported" }
  /api/v1/jobs:
    get:
      tags: [jobs]
      summary: List jobs, newest first, of one or every backend
      operationId: listJobs
      x-mcp-tool: list_jobs
      parameters:
        - $ref: "#/components/parameters/BackendQuery"
      responses:
        "200":
          description: jobs
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
  /api/v1/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [jobs]
      summary: One job with progress
      operationId: getJob
      x-mcp-tool: get_job
      responses:
        "200":
          description: job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [jobs]
      summary: Cancel a running job
      operationId: cancelJob
      x-mcp-tool: cancel_job
      responses:
        "200":
          description: job after cancellation request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  parameters:
    ModelName:
      name: name
      in: path
      required: true
      description: Model reference; may contain `/` and `:` (the remainder of the path is the name).
      schema: { type: string }
      example: smollm2:135m
    BackendQuery:
      name: backend
      in: query
      required: false
      description: "Restrict the operation to one configured backend (`GET /api/v1/backends` lists them). Reads without it aggregate every backend; a reference without it is resolved to the one backend holding it. An unknown or unconfigured name answers 400."
      schema: { $ref: "#/components/schemas/BackendName" }
  responses:
    Ambiguous:
      description: the reference exists on several backends and the request named none — repeat it with `backend`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: model or job not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidRequest:
      description: malformed request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unsupported:
      description: the backend/deployment does not offer this operation (capability flag is false)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BackendError:
      description: the serving backend failed or is unreachable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DoesNotFit:
      description: "the fit check refused the model (kserve) — the numbers do not fit, or the named node is not a serving target (eligible=false on GET /api/v1/nodes); the message says which"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [not_found, invalid_request, unsupported, conflict, does_not_fit, backend_error]
            message: { type: string }
    BackendName:
      type: string
      enum: [ollama, kserve, lemonade]
      description: a configured backend's driver name
    BackendErrors:
      type: object
      description: "per-backend failures of an aggregate read, keyed by backend name: the named backends could not be read (host server down, API unavailable) and their items are missing; absent when every backend answered"
      additionalProperties: { type: string }
      example: { lemonade: "dial tcp 172.21.0.1:13305: connection refused" }
    ModelRequest:
      type: object
      required: [model]
      properties:
        backend: { $ref: "#/components/schemas/BackendName" }
        model: { type: string }
    Capabilities:
      type: object
      description: Explicit data — render per flag, never per backend name.
      required: [pull, pullProgress, delete, load, unload, loadedModels, wire, presets, fitCheck, nodeInventory, search]
      properties:
        pull: { type: boolean, description: import a model by reference }
        pullProgress: { type: boolean, description: pull jobs report bytes completed/total }
        delete: { type: boolean }
        load: { type: boolean, description: load into memory / start serving }
        unload: { type: boolean, description: evict / stop serving }
        loadedModels: { type: boolean, description: list loaded models with memory use }
        wire: { type: boolean, description: create kagent ModelConfigs (needs Kubernetes access) }
        presets: { type: boolean, description: curated serving presets (kserve) }
        fitCheck: { type: boolean, description: node-memory fit check (kserve) }
        nodeInventory: { type: boolean, description: "GET /nodes reports nodes with memory budgets and reservations (kserve: the accelerator nodes with their download cache and eligibility; ollama: the proxied host from /proc/meminfo and /api/ps; lemonade: the proxied host from Lemonade's system-info)" }
        search: { type: boolean, description: model hub search (kserve) }
    Backend:
      type: object
      required: [backend, healthy, capabilities, loading]
      properties:
        backend:
          type: string
          enum: [ollama, kserve, lemonade]
        backends:
          type: array
          items: { $ref: "#/components/schemas/BackendName" }
          description: "every configured backend in order, the first being the default backend — only on the descriptor GET /api/v1/backend answers; a client that sees more than one name reads GET /api/v1/backends"
          example: [ollama, lemonade]
        version: { type: string, description: backend server version }
        endpoint: { type: string, description: backend endpoint as reached by model-manager }
        agentEndpoint:
          type: string
          description: |
            Backend endpoint as reached by agent pods — the host written into
            ModelConfigs (ollama: `--ollama-agent-host`, defaulting to
            `endpoint`; lemonade: `--lemonade-agent-host` plus `/api/v1`, the
            OpenAI-compatible base URL). Clients that match ModelConfigs to models by hostname
            compare against this, not `endpoint`. Absent when the backend has
            no single agent-facing endpoint (kserve: every served model has its
            own predictor URL in `running.endpoint` / `modelConfig.endpoint`).
          example: http://172.21.0.1:11434
        healthy: { type: boolean }
        message: { type: string }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        loading: { $ref: "#/components/schemas/Loading" }
        wiring:
          type: object
          description: present when wire=true
          properties:
            namespace: { type: string }
            apiVersion: { type: string, example: v1alpha2 }
            autoWire: { type: boolean }
    Loading:
      type: object
      description: |
        How the backend brings models into memory and lets them go. A client
        explains a not-loaded model from these flags — "loads on first
        request" when `onDemand`, "not serving, agents fail" when not — and
        never from the backend name. ollama: `onDemand` and `idleEviction`
        true, `keepAliveScope: request`. kserve: both false, no keep-alive
        fields. lemonade: `onDemand` true, `idleEviction` false, no keep-alive
        fields — a loaded model stays until unloaded or until another model of
        its type needs the slot (Lemonade's `max_loaded_models`, one per type
        by default); that is displacement, not idle eviction. Older
        model-managers omit the block: treat that as unknown.
      required: [onDemand, idleEviction]
      properties:
        onDemand:
          type: boolean
          description: the backend loads a model on the first inference request naming it (ollama, lemonade); false means it must be loaded / served explicitly before agents can use it (kserve)
        idleEviction:
          type: boolean
          description: the backend evicts idle models on its own (ollama keep-alive); false means a loaded model stays until unloaded (kserve; lemonade — until unloaded or displaced by another model of its type)
        keepAliveDefault:
          type: string
          description: |
            model-manager's default keep-alive for `POST /api/v1/models/load`
            when the request carries none (the configured
            `--default-keep-alive`). NOT the host's own default for inference
            traffic (Ollama's `OLLAMA_KEEP_ALIVE`, 5m unless set) — that is not
            observable through the API, and it is what agent requests re-arm.
            Absent when the backend has no keep-alive.
          example: 5m
        keepAliveScope:
          type: string
          enum: [request, server]
          description: |
            `request` — every inference request re-arms the eviction timer with
            its own keep-alive, or the server default when it sends none, so a
            Load only pre-warms (ollama). `server` — a fixed server-side timer
            requests do not change. Absent when the backend has no keep-alive.
    Model:
      type: object
      required: [name, sizeBytes, loaded]
      properties:
        name: { type: string, example: smollm2:135m }
        backend: { $ref: "#/components/schemas/BackendName" }
        digest: { type: string }
        sizeBytes: { type: integer, format: int64 }
        modifiedAt: { type: string, format: date-time }
        format: { type: string, example: gguf }
        family: { type: string, example: llama }
        parameterSize: { type: string, example: 134.52M }
        quantization: { type: string, example: Q8_0 }
        contextLength: { type: integer, format: int64 }
        runtime: { type: string, example: flm, description: "what the backend runs the model with, on backends that have several (lemonade: the recipe — flm is FastFlowLM on the NPU, llamacpp, ryzenai-llm, ...); absent on ollama (one runtime) and kserve (the preset says)" }
        capabilities:
          type: array
          description: "model features (completion, tools, vision, embedding, thinking); lemonade maps its labels onto these (chat → completion, tool-calling → tools, reasoning → thinking, embeddings → embedding) and passes the others through (transcription, image, tts, coding, ...)"
          items: { type: string }
        node: { type: string, description: node holding the cache entry (kserve) }
        downloaded:
          type: boolean
          description: kserve — false for a model known only from a preset or a running InferenceService whose weights are not cached yet; absent means the backend lists downloads only
        path: { type: string, description: "kserve — cache directory (the InferenceService name the storage-initializer uses). Directories whose top level holds no model (no config.json, no weights file — Hugging Face client internals such as hf-home or xet) are not listed. The name is the repository known to have filled the directory (pre-warm marker, else the cache index recorded while an InferenceService served from it), else the preset or InferenceService of the same name, else the directory name." }
        preset: { type: string, description: "kserve — the serving preset whose model this is: the preset of the same name, else the one the InferenceService that filled the directory was composed from, else the single preset serving the repository" }
        loaded: { type: boolean }
        running: { $ref: "#/components/schemas/LoadedModel" }
        modelConfig: { $ref: "#/components/schemas/ModelConfigRef" }
    LoadedModel:
      type: object
      required: [name, sizeBytes]
      properties:
        name: { type: string }
        backend: { $ref: "#/components/schemas/BackendName" }
        digest: { type: string }
        sizeBytes: { type: integer, format: int64, description: "memory footprint (kserve — the preset's weights; lemonade — the catalog size, Lemonade reports no per-model memory)" }
        vramBytes: { type: integer, format: int64 }
        contextLength: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time, description: when the backend will evict the model (absent = forever/unknown) }
        endpoint: { type: string, description: inference URL (kserve — the predictor's in-cluster URL) }
        node: { type: string }
        status:
          type: string
          description: "ollama and lemonade `loaded` (lemonade reports its own state, e.g. `loading`, until the model's backend process answers); kserve InferenceService readiness `Ready`, `NotReady`, `Pending` or `Terminating`"
          example: loaded
        message: { type: string, description: kserve — why the model is not ready }
        resource: { type: string, description: kserve — InferenceService name (also the served model name) }
        preset: { type: string, description: kserve — preset the InferenceService was created from }
        gpus: { type: integer, format: int64, description: kserve — accelerators the predictor requests }
        managedBy: { type: string, description: kserve — app.kubernetes.io/managed-by of the InferenceService (model-manager, backstage, ...); unload works for model-manager's and for preset-labelled ones }
        device: { type: string, example: npu, description: "lemonade — where the model runs as Lemonade reports it: npu, gpu, cpu, or several such as `gpu npu`" }
        pinned: { type: boolean, description: lemonade — exempt from slot eviction (loaded with keepAlive -1) }
    ModelConfigRef:
      type: object
      description: |
        kagent ModelConfig of a model. ollama and lemonade: named after the model
        reference (`smollm2:135m` → `smollm2-135m`, `qwen3-it-4b-FLM` →
        `qwen3-it-4b-flm`). kserve: named after the
        InferenceService (`qwen3-8-27b`), the same rule the portal's serve flow
        applies; a ModelConfig someone else created for the same predictor
        (same host, same served model name) counts as the model's wiring and is
        reported with `managed: false` — model-manager never duplicates or
        deletes it.
      required: [name, namespace, ready, managed]
      properties:
        name: { type: string, example: smollm2-135m }
        backend: { $ref: "#/components/schemas/BackendName", description: "the backend the ModelConfig belongs to (label model-manager.giantswarm.io/backend); with the model reference it identifies the ModelConfig — the same reference on two backends is two ModelConfigs, the second named <derived>-<backend>. Absent on a ModelConfig without the label." }
        namespace: { type: string, example: kagent }
        apiVersion: { type: string, example: kagent.dev/v1alpha2 }
        provider: { type: string, example: Ollama }
        model: { type: string, description: the backend's model reference }
        providerModel: { type: string, description: spec.model — the name the provider serves the model under (kserve — the InferenceService name) }
        endpoint: { type: string, description: openAI.baseUrl or ollama.host }
        managed: { type: boolean, description: created by model-manager (only these are updated or deleted) }
        ready: { type: boolean, description: mirrors the kagent Accepted condition }
        message: { type: string }
    Job:
      type: object
      required: [id, type, model, phase, bytesCompleted, bytesTotal, percent, createdAt, wire]
      properties:
        id: { type: string }
        backend: { $ref: "#/components/schemas/BackendName", description: "the backend the job runs on; the same reference pulled on two backends is two jobs" }
        type:
          type: string
          enum: [pull, load]
          description: pull = import with progress; load = kserve — follows a served model to readiness, then wires it (result = ModelConfigRef)
        model: { type: string }
        phase:
          type: string
          enum: [pending, running, succeeded, failed, cancelled]
        status: { type: string, description: backend progress message, e.g. pulling manifest }
        bytesCompleted: { type: integer, format: int64 }
        bytesTotal: { type: integer, format: int64 }
        percent: { type: number }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        wire: { type: boolean, description: whether the job wires the model on success }
        node:
          type: string
          description: "kserve — node whose cache receives the download: the one the request named, else the one model-manager picked after the fit check. Absent on ollama and lemonade, and on a shared cache."
        preset:
          type: string
          description: "kserve — serving preset the download is for: the one the request named, else the single preset serving the model. Absent on ollama and lemonade."
        requestedBy:
          type: string
          description: "the caller who started the job (email, else the IdP subject) when the server runs with OAuth; absent for jobs the service starts on its own (adopted downloads) and on servers without OAuth"
        result:
          description: operation output; for pull with wire and for load jobs, the ModelConfigRef
          oneOf:
            - $ref: "#/components/schemas/ModelConfigRef"
            - type: "null"
    Preset:
      type: object
      description: a published ServingPreset, resolved for clients (kserve)
      required: [name, displayName, model, gpus, weightsBytes, overheadBytes, requiredBytes]
      properties:
        name: { type: string, example: qwen3-14b, description: also the InferenceService name a load creates }
        backend: { $ref: "#/components/schemas/BackendName" }
        displayName: { type: string }
        description: { type: string, description: operator notes (markdown) }
        source: { type: string, enum: [shipped, values], description: where the preset came from }
        model: { type: string, example: Qwen/Qwen3-14B, description: Hugging Face repository }
        storageUri: { type: string, example: hf://Qwen/Qwen3-14B }
        format: { type: string, example: vLLM }
        runtime: { type: string, example: kserve-vllm }
        contextLength: { type: integer, format: int64 }
        capabilities: { type: array, items: { type: string } }
        license: { type: string }
        gpus: { type: integer, format: int64 }
        weightsBytes: { type: integer, format: int64 }
        overheadBytes: { type: integer, format: int64 }
        requiredBytes: { type: integer, format: int64, description: weights + overhead }
        args: { type: array, items: { type: string } }
        nodeSelector: { type: object, additionalProperties: { type: string } }
        chatTemplate: { type: string, description: ConfigMap of the chat template mounted into the predictor }
    SearchResult:
      type: object
      required: [id, downloads, likes, gated, private]
      properties:
        id: { type: string, example: Qwen/Qwen3-14B }
        author: { type: string }
        downloads: { type: integer, format: int64 }
        likes: { type: integer, format: int64 }
        gated: { type: boolean, description: needs a hub token with access to download }
        private: { type: boolean }
        pipelineTag: { type: string, example: text-generation }
        library: { type: string, example: transformers }
        tags: { type: array, items: { type: string } }
        lastModified: { type: string, format: date-time }
        presets: { type: array, items: { type: string }, description: serving presets that serve exactly this model }
    FitResult:
      type: object
      required: [model, fits, weightsBytes, overheadBytes, requiredBytes, budgetBytes, reservedBytes, freeBytes, gated, private, tokenConfigured, cached]
      properties:
        model: { type: string }
        backend: { $ref: "#/components/schemas/BackendName" }
        fits: { type: boolean }
        reason: { type: string, description: human-readable explanation of the numbers }
        preset: { type: string, description: preset used for overhead (and weights when the hub could not tell) }
        presets: { type: array, items: { type: string }, description: every preset serving the model }
        weightsBytes: { type: integer, format: int64 }
        weightsSource: { type: string, enum: [safetensors-index, tree, preset] }
        overheadBytes: { type: integer, format: int64 }
        requiredBytes: { type: integer, format: int64 }
        downloadBytes: { type: integer, format: int64, description: what a pull fetches (all repository files) }
        node: { type: string, description: node the check was made against }
        budgetBytes: { type: integer, format: int64 }
        budgetSource: { type: string, enum: [gpu-labels, allocatable, annotation], description: how the node budget was derived; `annotation` = the node's memory-budget-gib annotation }
        reservedBytes: { type: integer, format: int64, description: needed by the models already served on the node }
        freeBytes: { type: integer, format: int64 }
        gated: { type: boolean }
        private: { type: boolean }
        tokenConfigured: { type: boolean, description: a hub token Secret is configured }
        cached: { type: boolean, description: the model is already in the node's cache }
    NodeInfo:
      type: object
      required: [name, ready, eligible, allocatableMemoryBytes, gpuCount, budgetBytes, reservedBytes, freeBytes]
      properties:
        name: { type: string }
        backend: { $ref: "#/components/schemas/BackendName" }
        ready: { type: boolean }
        eligible: { type: boolean, description: "a model can be served on this node right now (kserve: ready, inside the serving node selector, able to mount the cache claim when predictors mount it; ollama, lemonade: always true, the host is the only serving target); pull, load and fit-check refuse a node with eligible=false and echo the reason" }
        eligibilityReason: { type: string, description: "why eligible is false, human-readable, several reasons joined with `; ` (kserve: `not ready`, `outside the serving node selector (k=v)`, `cache claim <claim> is pinned to <node>`); absent when eligible" }
        architecture: { type: string, example: arm64 }
        allocatableMemoryBytes: { type: integer, format: int64 }
        gpuCount: { type: integer, format: int64, description: "accelerators on the node (kserve: from the GPU resource / feature-discovery labels; lemonade: the NPU and the GPUs Lemonade found available); 0 on ollama, whose API does not expose them" }
        gpuMemoryBytes: { type: integer, format: int64, description: memory of one GPU from the node labels }
        gpuProduct: { type: string, description: "kserve — from the node labels; lemonade — the NPU when there is one, else the first GPU" }
        accelerated: { type: boolean, description: "ollama only: true when any loaded model has memory on an accelerator (`size_vram` > 0 in /api/ps, i.e. `running.vramBytes` > 0), false when none has or nothing is loaded; absent on backends that count accelerators in gpuCount" }
        budgetBytes: { type: integer, format: int64 }
        budgetSource: { type: string, enum: [gpu-labels, allocatable, annotation, host-meminfo, override, system-info], description: "how the budget was derived; `annotation` = overridden by `model-manager.giantswarm.io/memory-budget-gib` on the node (kserve); `host-meminfo` = MemTotal of /proc/meminfo as the model-manager pod sees it (ollama); `override` = set by the operator through the chart value `ollama.memoryBudgetGiB` / `--ollama-memory-budget-gib` (ollama); `system-info` = the host memory Lemonade Server reports (lemonade)" }
        message: { type: string, description: "a budget derivation note — an ignored, unparsable budget annotation (kserve); what the host figures mean, whether /proc/meminfo could be read and whether an operator override applied or was ignored (ollama)" }
        reservedBytes: { type: integer, format: int64, description: "memory the models served/loaded on the node need (kserve: preset requirements; ollama: Σ `size` over /api/ps; lemonade: Σ catalog sizes of the loaded models)" }
        freeBytes: { type: integer, format: int64, description: budgetBytes − reservedBytes, never negative }
        cache:
          type: object
          description: the download cache on this node; absent when the node holds none (always on ollama; lemonade — the model store)
          required: [claim, mountPath, models, bytesUsed]
          properties:
            claim: { type: string }
            mountPath: { type: string }
            models: { type: integer }
            bytesUsed: { type: integer, format: int64 }
            scannedAt: { type: string, format: date-time }
            shared: { type: boolean, description: network storage visible from every node }
            inventory: { type: string, enum: [pod, daemonset, models], description: how the contents were read — a short-lived scan pod on the node, the cache-agent DaemonSet pod there (kserve.inventory.mode), or the backend's own model list (lemonade) }
            error: { type: string, description: last scan failure (e.g. no cache-agent pod on the node); contents may be stale }
